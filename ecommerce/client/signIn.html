<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in | Gbogbolowo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <main class="auth-page">
        <a class="brand auth-brand" href="signIn.html">Gbogbolowo</a>
        <section class="auth-card" aria-labelledby="auth-title">
            <div class="auth-aside">
                <span class="hero-eyebrow">Welcome back</span>
                <h1>Good to see you again.</h1>
                <p>Sign in to pick up where your style journey left off.</p>
            </div>
            <div class="auth-content">
                <p class="auth-kicker">Your account</p>
                <h2 id="auth-title">Sign in</h2>
                <p class="text-muted mb-4">Enter your details to continue.</p>
                <div class="auth-field">
                    <label for="email" class="form-label">Email address</label>
                    <input type="email" id="email" class="form-control" autocomplete="email" placeholder="you@example.com">
                </div>
                <div class="auth-field">
                    <label for="pass" class="form-label">Password</label>
                    <input type="password" id="pass" class="form-control" autocomplete="current-password" placeholder="Enter your password">
                </div>
                <button class="btn btn-brand auth-submit" type="button" onclick="signIn()">Sign in</button>
                <div id="show" class="auth-feedback" aria-live="polite"></div>
                <p class="auth-switch">New to Gbogbolowo? <a href="signUp.html">Create an account</a></p>
            </div>
        </section>
    </main>
</body>
<script>
    const getUsers = () => {
        try {
            const saved = JSON.parse(localStorage.getItem('users') || '[]');
            return Array.isArray(saved) ? saved : [];
        } catch (error) {
            return [];
        }
    };

    const setFeedback = (message) => {
        const feedback = document.getElementById('show');
        if (!feedback) return;
        feedback.textContent = message;
        if (message) {
            clearTimeout(setFeedback.timeout);
            setFeedback.timeout = setTimeout(() => {
                feedback.textContent = '';
            }, 2000);
        }
    };

    window.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) {
            e.preventDefault();
            signIn();
        }
    });

    const signIn = () => {
        const email = document.getElementById('email').value.trim().toLowerCase();
        const pass = document.getElementById('pass').value.trim();
        const userInfo = getUsers();

        if (email === '' || pass === '') {
            setFeedback('Fill in your email and password.');
            return;
        }

        const found = userInfo.find(user => String(user.email || '').trim().toLowerCase() === email && String(user.pass || '') === pass);
        if (found) {
            window.location.href = 'index.html';
            return;
        }

        setFeedback('We could not find an account with those details.');
    };
</script>
</html>
