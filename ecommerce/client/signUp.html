<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create an account | Gbogbolowo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <main class="auth-page">
        <a class="brand auth-brand" href="signUp.html">Gbogbolowo</a>
        <section class="auth-card auth-card-signup" aria-labelledby="auth-title">
            <div class="auth-aside">
                <span class="hero-eyebrow">The Gbogbolowo edit</span>
                <h1>Make every day your own.</h1>
                <p>Create an account for a more personal way to discover your next favourite look.</p>
            </div>
            <div class="auth-content">
                <p class="auth-kicker">Join us</p>
                <h2 id="auth-title">Create an account</h2>
                <p class="text-muted mb-4">A few details to get you started.</p>
                <div class="row g-3">
                    <div class="col-sm-6 auth-field">
                        <label for="firstName" class="form-label">First name</label>
                        <input type="text" id="firstName" class="form-control" autocomplete="given-name" placeholder="First name">
                    </div>
                    <div class="col-sm-6 auth-field">
                        <label for="lastName" class="form-label">Last name</label>
                        <input type="text" id="lastName" class="form-control" autocomplete="family-name" placeholder="Last name">
                    </div>
                    <div class="col-12 auth-field">
                        <label for="email" class="form-label">Email address</label>
                        <input type="email" id="email" class="form-control" autocomplete="email" placeholder="you@example.com">
                    </div>
                    <div class="col-12 auth-field">
                        <label for="pass" class="form-label">Password</label>
                        <input type="password" id="pass" class="form-control" autocomplete="new-password" placeholder="Create a password">
                    </div>
                </div>
                <button class="btn btn-brand auth-submit" type="button" onclick="signUp()">Create account</button>
                <div id="show" class="auth-feedback" aria-live="polite"></div>
                <p class="auth-switch">Already have an account? <a href="signIn.html">Sign in</a></p>
            </div>
        </section>
    </main>
</body>
<script>
    window.addEventListener('keypress', (e) => {
    if (e.key == 'Enter') {
        signUp()
    }
})
    const userInfo = JSON.parse(localStorage.getItem('users')) || []

    const signUp = () =>{
        let firstName = document.getElementById('firstName').value
        let lastName = document.getElementById('lastName').value
        let email = document.getElementById('email').value
        let pass = document.getElementById('pass').value

        // console.log(firstName,lastName,email,pass);
          let users = {
            firstName,
            lastName,
            email,
            pass
        }

        if(firstName.trim() === '' || lastName.trim() === '' || email.trim() === '' || pass.trim() === ''){
            show.textContent = 'Please complete all fields.'
            setTimeout(()=>{
                show.textContent = ''
            },3000)
        }else{
            const found = userInfo.find(user => user.email === users.email)
            if(found){
                show.textContent = 'An account with that email already exists.'
                setTimeout(()=>{
                    show.textContent = ''
                },2000)
            }else{
              
                userInfo.push(users)
                localStorage.setItem('users', JSON.stringify(userInfo))
                setTimeout(() => {
            window.location.href = 'signIn.html'
        }, 2000);
            }
        }
        
// alert('i workkkk')
    }
</script>
</html>
