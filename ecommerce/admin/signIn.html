<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Admin sign in | Gbogbolowo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/admin.css" rel="stylesheet">
</head>
<body class="admin-auth-page">
    <main class="admin-auth-card">
        <a class="admin-auth-brand" href="signIn.html">Gbogbolowo <span>Admin</span></a>
        <p class="text-muted mb-1">Administrator access</p>
        <h1>Sign in</h1>
        <p class="text-muted mb-4">Sign in with the authorized <strong>taofeeksherif66@mail.com</strong> account.</p>
        <form id="admin-signin-form">
            <div class="mb-3">
                <label class="form-label" for="admin-email">Email address</label>
                <input class="form-control" type="email" id="admin-email" autocomplete="username" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="admin-password">Password</label>
                <input class="form-control" type="password" id="admin-password" autocomplete="current-password" required>
            </div>
            <button class="btn btn-brand w-100" type="submit">Sign in</button>
        </form>
        <div id="show" class="auth-feedback mt-3" aria-live="polite"></div>
        <p class="small text-muted mt-4 mb-0">Need to set up the allowed admin account? <a href="signUp.html">Create it here</a>.</p>
        <p class="small mt-3 mb-0"><a href="../client/index.html">Return to the store</a></p>
    </main>
    <script type="module" src="js/admin-auth.js"></script>
</body>
</html>
