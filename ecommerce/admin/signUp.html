<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Admin account setup | Gbogbolowo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/admin.css" rel="stylesheet">
</head>
<body class="admin-auth-page">
    <main class="admin-auth-card">
        <a class="admin-auth-brand" href="signIn.html">Gbogbolowo <span>Admin</span></a>
        <p class="text-muted mb-1">Restricted account setup</p>
        <h1>Create admin account</h1>
        <p class="text-muted mb-4">Only <strong>admin@gmail.com</strong> can register for admin access.</p>
        <form id="admin-signup-form">
            <div class="mb-3">
                <label class="form-label" for="admin-email">Admin email address</label>
                <input class="form-control" type="email" id="admin-email" autocomplete="email" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="admin-password">Password</label>
                <input class="form-control" type="password" id="admin-password" autocomplete="new-password" minlength="8" required>
                <div class="form-text">At least 8 characters, with a letter and a number.</div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="admin-password-confirm">Confirm password</label>
                <input class="form-control" type="password" id="admin-password-confirm" autocomplete="new-password" minlength="8" required>
            </div>
            <button class="btn btn-brand w-100" type="submit">Create admin account</button>
        </form>
        <div id="show" class="auth-feedback mt-3" aria-live="polite"></div>
        <p class="small text-muted mt-4 mb-0">Already registered? <a href="signIn.html">Sign in</a>.</p>
        <p class="small mt-3 mb-0"><a href="../client/index.html">Return to the store</a></p>
    </main>
    <script type="module" src="js/admin-auth.js"></script>
</body>
</html>
